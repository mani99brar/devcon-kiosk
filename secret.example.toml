# Copy to secret.toml and put the team's code in it (at least 16 random characters).
# Ask whoever runs the booth for the current code; never commit secret.toml.
access_code = "change-me-to-a-long-random-code"
# Team control links (Tailscale Funnel), one per Pi; the page on either link controls both.
public_urls = [
  "https://kleros1.<your-tailnet>.ts.net",
  "https://kleros2.<your-tailnet>.ts.net",
]
# Relay server (docs/server-design.md): uncomment and fill in to turn the Pi's uplink on.
# server_url = "https://kleros-devcon-screens.labs.accesoprohibido.com"  # leave out to keep the uplink off
# server_lab_token = "<edge1's Pi token>"  # sent as X-Lab-Token
# server_pi_key = "<same value as PI_KEY in the server's .env>"  # sent as X-Pi-Key
# server_team_link = "https://kleros-devcon-screens-manager.labs.accesoprohibido.com/?lab_token=<phone token>"  # printed by links.sh
